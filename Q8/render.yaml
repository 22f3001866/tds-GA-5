services:
  - type: web
    name: ga5-redteam-guardrail
    runtime: python
    rootDir: Q8
    buildCommand: pip install -r requirements.txt && python setup_files.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
